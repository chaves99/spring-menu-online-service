spring.application.name=menu-online

spring.datasource.url=${DB_URL:jdbc:postgresql://172.17.0.2:5432/menudb}
spring.datasource.username=${DB_USER:menuuser}
spring.datasource.password=${DB_PASS:menupass}

spring.datasource.driver-class-name=org.postgresql.Driver

s3.url=${BUCKET_ENDPOINT}
s3.region=${REGION}
s3.bucketName=${BUCKET_NAME}
s3.accessKeyId=${BUCKET_ACCESS_KEY_ID}
s3.secretAccessKey=${BUCKET_SECRET_ACCESS_KEY}

aws.region=${AWS_REGION}
aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}


stripe.secretKey=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

freetier.days=20

# email to receive email from clients
hostFrom=${MAILGUN_HOST_FROM:ItiMenu Support <support@itimenu.app>}
company-email=itimenu@outlook.com

